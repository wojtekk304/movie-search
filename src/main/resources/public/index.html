<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Movie Database</title>
    <style>
        body {
          font-family: 'Segoe UI', sans-serif;
          background-color: #f2f2f2;
          padding: 30px;
          color: #333;
        }

        h1 {
          color: #222;
        }

        .container {
          background: #fff;
          padding: 20px 30px;
          border-radius: 10px;
          box-shadow: 0 4px 10px rgba(0,0,0,0.1);
          max-width: 1000px;
          margin: auto;
        }

        .description {
          margin-bottom: 20px;
          font-size: 16px;
          color: #555;
        }

        input[type="text"] {
          padding: 10px;
          width: 250px;
          border: 1px solid #ccc;
          border-radius: 6px;
          font-size: 15px;
        }

        button {
          padding: 10px 15px;
          margin-left: 10px;
          background-color: #007BFF;
          color: white;
          border: none;
          border-radius: 6px;
          font-size: 15px;
          cursor: pointer;
        }

        button:hover {
          background-color: #0056b3;
        }

        table {
          margin-top: 25px;
          width: 100%;
          border-collapse: collapse;
        }

        th, td {
          text-align: left;
          padding: 12px;
          border-bottom: 1px solid #ddd;
        }

        th {
          background-color: #007BFF;
          color: white;
        }

        tr:hover {
          background-color: #f1f1f1;
        }

        .actions {
          margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 Movie Database</h1>
    <p class="description">
        This is a searchable movie database loaded from a CSV file. You can search by genre or view all available movies.
    </p>

    <div class="actions">
        <input type="text" id="genreInput" placeholder="Enter genre (e.g. Comedy)" />
        <button onclick="searchGenre()">Search Genre</button>
        <button onclick="fetchAll()">Show All</button>
    </div>

    <table id="moviesTable">
        <thead>
        <tr>
            <th>Title</th>
            <th>Genre</th>
            <th>Studio</th>
            <th>Audience %</th>
            <th>Profitability</th>
            <th>Rotten Tomatoes %</th>
            <th>Gross (M)</th>
            <th>Year</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    async function fetchMovies(url) {
      const res = await fetch(url);
      const data = await res.json();
      const tbody = document.querySelector("#moviesTable tbody");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='8'>No movies found.</td></tr>";
        return;
      }

      data.forEach(movie => {
        const row = tbody.insertRow();
        row.insertCell().textContent = movie["Title"];
        row.insertCell().textContent = movie["Genre"];
        row.insertCell().textContent = movie["Studio"];
        row.insertCell().textContent = movie["Audience %"];
        row.insertCell().textContent = movie["Profitability"];
        row.insertCell().textContent = movie["Rotten Tomatoes %"];
        row.insertCell().textContent = movie["Gross (M)"];
        row.insertCell().textContent = movie["Year"];
      });
    }

    function searchGenre() {
      const genre = document.getElementById("genreInput").value;
      if (genre.trim() !== "") {
        fetchMovies(`/movies?genre=${encodeURIComponent(genre)}`);
      }
    }

    function fetchAll() {
      fetchMovies("/movies");
    }

    // Load all movies on page load
    window.onload = fetchAll;
</script>

</body>
</html>
